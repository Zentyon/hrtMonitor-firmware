[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
build_src_filter = +<*> -<voice_test_main.cpp> -<keymap_main.cpp> -<pintest_main.cpp>
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
build_flags =
  -Iinclude
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=23
  -D TFT_MISO=19
  -D TFT_SCLK=18
  -D TFT_SCK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=-1
  -D LOAD_GLCD=1
  -D LOAD_FONT=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=10000000

# Prueba de voz: solo compila voice_test_main.cpp (bocina + MAX98357A).
# Flashear con: pio run -e voice_test -t upload && pio device monitor -e voice_test
[env:voice_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
build_src_filter = +<*> -<main.cpp> -<keymap_main.cpp> -<pintest_main.cpp>
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
build_flags =
  -Iinclude
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=23
  -D TFT_MISO=19
  -D TFT_SCLK=18
  -D TFT_SCK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=-1
  -D LOAD_GLCD=1
  -D LOAD_FONT=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=10000000

# Descubridor de mapeo del teclado: reporta que driver ve cada tecla.
# Flashear con: pio run -e keymap -t upload (ver src/keymap_main.cpp)
[env:keymap]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<main.cpp> -<voice_test_main.cpp> -<pintest_main.cpp> +<tests/**>

# Autotest de pines sin teclado (detecta cortos: ver src/pintest_main.cpp)
[env:pintest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<main.cpp> -<voice_test_main.cpp> -<keymap_main.cpp>
